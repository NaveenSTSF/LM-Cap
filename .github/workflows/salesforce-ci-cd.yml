name: Salesforce CI/CD

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, tests, and formatting checks
        run: npm run ci:verify

  deploy:
    name: Validate or deploy Salesforce metadata
    needs: verify
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'salesforce-validation' || 'salesforce-production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate Salesforce CLI
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "SFDX_AUTH_URL is not configured for this GitHub environment."
            exit 1
          fi
          printf '%s' "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin=- --alias ci-org --set-default

      - name: Validate pull request deployment
        if: github.event_name == 'pull_request'
        run: sf project deploy start --source-dir force-app --target-org ci-org --dry-run --test-level RunLocalTests --wait 30

      - name: Deploy main branch
        if: github.event_name != 'pull_request'
        run: sf project deploy start --source-dir force-app --target-org ci-org --test-level RunLocalTests --wait 30
